providers:
  kubernetesIngress:
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

ports:
  web:
    port: 80
    hostPort: 80
  websecure:
    port: 443
    hostPort: 443
  postgres:
    port: 5432
    hostPort: 30432
    protocol: TCP
    expose:
      default: true
  redis:
    port: 6379
    hostPort: 30379
    protocol: TCP
    expose:
      default: true

service:
  type: ClusterIP

nodeSelector:
  ingress-ready: "true"

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
