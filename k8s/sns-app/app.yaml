apiVersion: apps/v1
kind: Deployment
metadata:
  name: sns-app
  namespace: sns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sns-app
  template:
    metadata:
      labels:
        app: sns-app
    spec:
      containers:
        - name: sns-app
          image: ghcr.io/apieceofcoding/sns-app:9230e88
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/snsdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sns-secret
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sns-secret
                  key: db-password
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: RUSTFS_ENDPOINT
              value: http://rustfs:9000
            - name: RUSTFS_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: sns-secret
                  key: rustfs-access-key
            - name: RUSTFS_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: sns-secret
                  key: rustfs-secret-key
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4318
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sns-app
  namespace: sns
  labels:
    app: sns-app
spec:
  type: NodePort
  selector:
    app: sns-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
