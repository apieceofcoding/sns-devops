apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sns-app-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: sns-app
      rules:
        - alert: SnsAppHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job="sns-app", status=~"5.."}[1m]))
              /
              sum(rate(http_server_requests_seconds_count{job="sns-app"}[1m]))
            ) > 0.1
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "sns-app 5xx 에러율 10% 초과"
            description: "현재 에러율: {{ $value | humanizePercentage }}"

        - alert: SnsAppHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket{job="sns-app"}[1m])) by (le)
            ) > 1
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "sns-app p95 응답시간 1초 초과"
            description: "현재 p95: {{ $value | humanizeDuration }}"

        - alert: SnsAppDown
          expr: |
            up{job="sns-app"} == 0
            or
            absent(up{job="sns-app"}) == 1
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "sns-app 다운"
            description: "Prometheus가 sns-app을 scrape할 수 없음"
